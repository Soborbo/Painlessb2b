:root {
  --primary-700: #31536e;
  --primary-800: #274257;
  --primary-900: #1d3240;
  --terra-500: #B35535;
  --terra-600: #A34A2D;
  --terra-bright: #C65D3B;
  --gold-500: #D4A84B;
  --gold-200: #F5E6C8;
  --teal-600: #1B4D4D;
  --teal-700: #163f3f;
  --cream: #FAF7F2;
  --warm-white: #FFFFFF;
  --ink: #2D2D2D;
  --warm-gray-100: #E8E6E3;
  --warm-gray-200: #D1CEC9;
  --warm-gray-300: #A8A49E;
  --warm-gray-400: #8A8680;
  --warm-gray-500: #6B6B6B;

  --serif: 'Fraunces', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--sans);
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
}

/* ============================================
   TOP BAR
   ============================================ */
.topbar {
  background: var(--primary-900);
  color: var(--cream);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-bottom: 3px solid var(--gold-500);
  flex-shrink: 0;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--serif);
}

.topbar-brand .mark {
  width: 28px; height: 28px;
  border: 2px solid var(--terra-bright);
  transform: rotate(45deg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.topbar-brand .mark::after {
  content: 'P';
  transform: rotate(-45deg);
  font-family: var(--serif);
  color: var(--terra-bright);
  font-weight: 700;
  font-size: 14px;
}
.topbar-brand .name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.topbar-brand .name em { font-style: italic; color: var(--terra-bright); }

.topbar-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.btn {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 9px 16px;
  border: 1px solid rgba(245,247,242,.20);
  background: transparent;
  color: var(--cream);
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s ease;
}
.btn:hover {
  background: rgba(245,247,242,.08);
  border-color: rgba(245,247,242,.35);
}

.btn-primary {
  background: var(--terra-bright);
  border-color: var(--terra-bright);
  color: var(--cream);
}
.btn-primary:hover {
  background: var(--terra-600);
  border-color: var(--terra-600);
}

/* ============================================
   MAIN LAYOUT
   ============================================ */
.app {
  display: grid;
  grid-template-columns: 460px 1fr;
  flex: 1;
  min-height: 0;
}

@media (max-width: 1100px) {
  .app { grid-template-columns: 1fr; }
}

/* ============================================
   LEFT PANEL - FORM
   ============================================ */
.panel-left {
  background: var(--cream);
  border-right: 1px solid var(--warm-gray-200);
  overflow-y: auto;
  padding: 0 0 60px 0;
}

.intro-card {
  margin: 24px;
  padding: 18px 20px;
  background: var(--warm-white);
  border-left: 3px solid var(--gold-500);
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
}
.intro-card .head {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  color: var(--primary-700);
  margin-bottom: 4px;
}

.field-group {
  margin: 4px 24px 0;
  border-top: 1px solid var(--warm-gray-100);
}
.field-group:first-of-type { border-top: none; }

.field-group-header {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  color: var(--primary-700);
  padding: 18px 0 4px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.field-group-header::after {
  content: '+';
  font-family: var(--sans);
  font-weight: 400;
  color: var(--warm-gray-400);
  font-size: 18px;
  transition: transform 0.2s;
}
.field-group.open .field-group-header::after {
  content: '–';
}
.field-group-header em { font-style: italic; }

.field-group-body {
  display: none;
  padding-bottom: 12px;
}
.field-group.open .field-group-body { display: block; }

.field {
  margin-top: 12px;
}

.field-label {
  display: block;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--warm-gray-500);
  margin-bottom: 5px;
}

.field input[type="text"],
.field textarea {
  width: 100%;
  padding: 9px 12px;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--warm-white);
  border: 1px solid var(--warm-gray-200);
  border-radius: 2px;
  transition: border-color 0.12s, box-shadow 0.12s;
  resize: vertical;
}

.field input[type="text"]:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--terra-500);
  box-shadow: 0 0 0 2px rgba(179, 85, 53, .15);
}

.field textarea {
  min-height: 70px;
  font-family: var(--sans);
}

/* ============================================
   RIGHT PANEL - PREVIEW
   ============================================ */
.panel-right {
  background: #ECE6D9;
  overflow-y: auto;
  padding: 32px 24px;
  position: relative;
}

.preview-status {
  position: sticky;
  top: 0;
  margin: -32px -24px 20px;
  padding: 8px 24px;
  background: rgba(15, 45, 61, .95);
  color: var(--cream);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
  backdrop-filter: blur(8px);
}
.preview-status .dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--gold-500);
  border-radius: 50%;
  margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.preview-frame {
  background: white;
  box-shadow: 0 6px 24px rgba(15,45,61,.20), 0 2px 4px rgba(15,45,61,.08);
  margin: 0 auto;
  width: 100%;
  max-width: 794px;
  height: 4500px; /* 4 A4 pages at 96dpi: 4 × 1123px ≈ 4492px, +8 buffer */
  border: none;
  display: block;
}

/* ============================================
   TOAST
   ============================================ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--primary-900);
  color: var(--cream);
  padding: 12px 24px;
  border-radius: 2px;
  font-size: 13px;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 20px rgba(15,45,61,.30);
  border-left: 3px solid var(--gold-500);
  opacity: 0;
  transition: all 0.3s cubic-bezier(.2,.9,.3,1);
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Scrollbar styling */
.panel-left::-webkit-scrollbar,
.panel-right::-webkit-scrollbar { width: 10px; }
.panel-left::-webkit-scrollbar-track,
.panel-right::-webkit-scrollbar-track { background: transparent; }
.panel-left::-webkit-scrollbar-thumb,
.panel-right::-webkit-scrollbar-thumb {
  background: var(--warm-gray-200);
  border-radius: 5px;
  border: 2px solid var(--cream);
}
.panel-left::-webkit-scrollbar-thumb:hover,
.panel-right::-webkit-scrollbar-thumb:hover { background: var(--warm-gray-300); }

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <span class="mark"></span>
    <span class="name">Proposal <em>Editor</em></span>
  </div>
  <div class="topbar-actions">
    <button class="btn" id="btn-reset">Reset</button>
    <button class="btn" id="btn-load">Load draft</button>
    <button class="btn" id="btn-save">Save draft</button>
    <button class="btn btn-primary" id="btn-print">Download PDF</button>
  </div>
</div>

<div class="app">
  <aside class="panel-left" id="panel-left">
    <div class="intro-card">
      <div class="head">How it works</div>
      Edit any field on the left. The preview on the right updates as you type.

ours</div><div class=\"price\">{{tier3_4hr}}</div></div>\n        <div class=\"price-row\"><div class=\"duration\">8 hours</div><div class=\"price\">{{tier3_8hr}}</div></div>\n        <div class=\"tier-fit\">{{tier3_fit}}</div>\n      </div>\n    </div>\n\n    <div class=\"tiers-includes\">\n      <div class=\"head\">{{includes_head}}</div>\n      {{includes_body}}\n    </div>\n\n    <div class=\"billing-notes\">\n      <div class=\"billing-note\">\n        <div class=\"head\">{{billing1_head_pre}}<em>{{billing1_head_em}}</em></div>\n        {{billing1_body}}\n      </div>\n      <div class=\"billing-note\">\n        <div class=\"head\">{{billing2_head_pre}}<em>{{billing2_head_em}}</em></div>\n        {{billing2_body}}\n      </div>\n    </div>\n\n    <p class=\"vat-note\">{{vat_note}}</p>\n  </div>\n</section>\n\n\n<section class=\"page page-5\">\n  <div class=\"strip\">\n    <div>{{brand_strapline_pre}} <span class=\"since-bright\">{{brand_strapline_year}}</span></div>\n    <div class=\"quote-num\"></div>\n  </div>\n\n  <div class=\"page-inner\">\n    <div class=\"section-marker-row\">\n      <div class=\"section-marker\">{{s3_marker}}</div>\n      <div class=\"section-marker-right\">{{s3_marker_right_pre}} <strong>{{s3_marker_right_em}}</strong></div>\n    </div>\n    <h2 class=\"section-title\">{{s3_title_pre}}<em>{{s3_title_em}}</em></h2>\n    <div class=\"section-divider\"></div>\n\n    <p class=\"section-intro\">{{s3_intro}}</p>\n\n    <div class=\"team-grid\">\n      <div class=\"team-card\">\n        <div class=\"team-photo-wrap\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAJYAlgDASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAAAAECAwQFBgcICf/EAEUQAAEEAQMCBQEFBwIEBQMEAwEAAgMRBAUSITFBBhMiUWFxBxQygZEjQlJiobHBCBUzctHwFiRDguFTkvEXNGOyJURz/8QAGwEAAwEBAQEBAAAAAAAAAAAA class=\"testimonial-text\">{{testimonial_text}}</p>\n      <div class=\"testimonial-attr\">\n        <span class=\"stars\">★★★★★</span>\n        <span class=\"attr-name\">{{testimonial_attr_name}}</span>\n        <span class=\"attr-source\">{{testimonial_attr_source}}</span>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"cta-block\">\n    <div>\n      <h2 class=\"cta-headline\">{{cta_headline_pre}}<em>{{cta_headline_em}}</em></h2>\n      <p class=\"cta-text\">{{cta_text}}</p>\n    </div>\n    <div class=\"cta-contact-block\">\n      <div class=\"label\">{{cta_label_1}}</div>\n      <div class=\"cta-phone\">{{cta_phone_1}}</div>\n      <div class=\"cta-email\">{{cta_email_1}}</div>\n      <div class=\"cta-divider\"></div>\n      <div class=\"label\">{{cta_label_2}}</div>\n      <div class=\"cta-phone\">{{cta_phone_2}}</div>\n      <div class=\"cta-email\">{{cta_email_2}}</div>\n    </div>\n  </div>\n\n  <div class=\"page-bottom-strip\">{{page_bottom}}</div>\n</section>\n\n</body>\n</html>";

const STORAGE_KEY = 'painless_proposal_editor_v1';

// ---------- State ----------
let data = loadDraft() || {...DEFAULT_DATA};

// ---------- Build form ----------
function buildForm() {
  const root = document.getElementById('form-root');
  root.innerHTML = '';

  FIELD_GROUPS.forEach((group, i) => {
    const grp = document.createElement('div');
    grp.className = 'field-group' + (i === 0 ? ' open' : '');

    const header = document.createElement('div');
    header.className = 'field-group-header';
    header.textContent = group.title;
    header.addEventListener('click', () => grp.classList.toggle('open'));
    grp.appendChild(header);

    const body = document.createElement('div');
    body.className = 'field-group-body';

    group.fields.forEach(([key, label, type]) => {
      const f = document.createElement('div');
      f.className = 'field';

      const lab = document.createElement('label');
      lab.className = 'field-label';
      lab.textContent = label;
      lab.setAttribute('for', 'f-' + key);
      f.appendChild(lab);

      let input;
      if (type === 'textarea') {
        input = document.createElement('textarea');
      } else {
        input = document.createElement('input');
        input.type = 'text';
      }
      input.id = 'f-' + key;
      input.value = data[key] || '';
      input.addEventListener('input', (e) => {
        data[key] = e.target.value;
        renderPreview();
        autoSave();
      });
      f.appendChild(input);
      body.appendChild(f);
    });

    grp.appendChild(body);
    root.appendChild(grp);
  });
}

// ---------- Render preview ----------
function renderPreview() {
  let html = PROPOSAL_TEMPLATE;

  // Build em-block versions for prop titles (wrap em portion in <em> only if non-empty)
  const emKeys = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'];
  const renderData = {...data};
  emKeys.forEach(k => {
    const em = data[k + '_title_em'] || '';
    renderData[k + '_title_em_block'] = em ? `<em>${em}</em>` : '';
  });

  // Mustache substitution
  html = html.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    if (renderData[key] !== undefined) return renderData[key];
    return '';
  });

  const iframe = document.getElementById('preview');
  iframe.srcdoc = html;
}

// ---------- Persistence ----------
function autoSave() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.warn('autoSave failed', e);
  }
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Buttons ----------
document.getElementById('btn-save').addEventListener('click', () => {
  autoSave();
  showToast('Draft saved to this browser');
});

document.getElementById('btn-load').addEventListener('click', () => {
  const d = loadDraft();
  if (!d) {
    showToast('No saved draft found');
    return;
  }
  data = {...DEFAULT_DATA, ...d};
  buildForm();
  renderPreview();
  showToast('Draft loaded');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Reset all fields to the original proposal text?\n\nThis will not delete your saved draft — click "Load draft" to restore it.')) return;
  data = {...DEFAULT_DATA};
  buildForm();
  renderPreview();
  showToast('Reset to defaults');
});

document.getElementById('btn-print').addEventListener('click', () => {
  // Try printing the iframe contents directly via contentWindow.print() —
  // this works without popups, and the browser print dialog gets the
  // iframe's @page rules so A4 sizing is applied correctly.
  const iframe = document.getElementById('preview');
  try {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    return;
  } catch (e) {
    console.warn('Direct iframe print failed, falling back to new window', e);
  }

  // Fallback: open the proposal HTML in a new window and print there
  const html = iframe.srcdoc;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if (!w) {
    alert('Pop-up blocked. Allow pop-ups for this page and try again, or use your browser\'s File → Print menu.');
    return;
  }
  w.addEventListener('load', () => {
    setTimeout(() => w.print(), 500);
  });
});

// ---------- Boot ----------
buildForm();
renderPreview();

</script>
